<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk</title>
  <link rel="icon" href="../Asset/logo/K.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body data-page="login" class="auth-page">

  <div class="auth-card">

    <div class="auth-logo"><a href="index.html" style="text-decoration: none;">Kampus<span>Kita</span></a></div>
    <p class="auth-subtitle">Masuk untuk membaca dan menulis artikel</p>

    <form id="login-form" novalidate autocomplete="off">

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email"
               placeholder="kamu@kampus.ac.id" autocomplete="email" required>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password"
               placeholder="••••••••" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn-auth">Masuk</button>

    </form>

    <div class="auth-switch">
      Belum punya akun? <a href="register.html">Daftar sekarang</a>
    </div>

    <!-- Demo hint -->
    <div class="mt-4 p-3 rounded" style="background:#f9fafb;border:1px solid #e5e7eb;">
      <p class="mb-1" style="font-size:.75rem;font-weight:700;color:#6b7280;letter-spacing:.06em;text-transform:uppercase;">Akun Demo</p>
      <p class="mb-0" style="font-size:.8rem;color:#374151;">
        <img src="../Asset/logo/email.png" alt="Email" width="20" height="20"> raka@kampus.ac.id &nbsp; <img src="../Asset/logo/key.png" alt="Password" width="20" height="20"> raka123<br>
         <img src="../Asset/logo/email.png" alt="Email" width="20" height="20"> sari@kampus.ac.id &nbsp; <img src="../Asset/logo/key.png" alt="Password" width="20" height="20"> sari123<br>
        <img src="../Asset/logo/email.png" alt="Email" width="20" height="20"> bima@kampus.ac.id &nbsp; <img src="../Asset/logo/key.png" alt="Password" width="20" height="20"> bima123<br>
      </p>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
