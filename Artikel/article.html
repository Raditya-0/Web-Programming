<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artikel</title>
  <link rel="icon" href="../Asset/logo/K.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body data-page="article">

  <!-- Navbar -->
  <nav class="site-navbar">
    <div class="container d-flex align-items-center justify-content-between gap-3">
      <a href="index.html" class="navbar-logo">Kampus<span>Kita</span></a>
      <div class="d-flex align-items-center gap-2" id="nav-auth"></div>
    </div>
  </nav>

  <!-- Article -->
  <main class="container py-5" id="article-container">
    <div class="row justify-content-center">
      <div class="col-lg-8">

        <!-- Back link -->
        <a href="index.html" class="d-inline-flex align-items-center gap-1 text-muted text-decoration-none mb-4"
           style="font-size:.85rem;">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M15 8a.5.5 0 0 0-.5-.5H2.707l3.147-3.146a.5.5 0 1 0-.708-.708l-4 4a.5.5 0 0 0 0 .708l4 4a.5.5 0 0 0 .708-.708L2.707 8.5H14.5A.5.5 0 0 0 15 8z"/>
          </svg>
          Kembali
        </a>

        <!-- Article header -->
        <header class="article-header">
          <h1 class="article-main-title" id="article-title"></h1>

          <div class="d-flex align-items-center gap-3 flex-wrap">
            <div id="article-author-avatar"></div>
            <div>
              <div class="fw-semibold" id="article-author-name"></div>
              <div class="d-flex gap-2 align-items-center mt-1">
                <span class="meta-date" id="article-date"></span>
                <span class="meta-sep">·</span>
                <span class="meta-read" id="article-readtime"></span>
              </div>
            </div>
          </div>
        </header>

        <!-- Hero image -->
        <img id="article-hero-img" src="" alt="" class="article-hero-img" loading="lazy">

        <!-- Body -->
        <article class="article-body" id="article-body"></article>

        <!-- Clap + Tags -->
        <div class="mt-4 pt-3" style="border-top:1px solid var(--border)">
          <div class="clap-wrap">
            <button id="clap-btn" title="Apresiasi artikel ini">
              <span class="clap-icon"><img src="../Asset/logo/hands-clapping.png" alt="Clap" width="20" height="20"></span>
              <span id="clap-count">0</span>
            </button>
            <span class="text-muted" style="font-size:.82rem">Klik untuk memberi apresiasi</span>
          </div>

          <div id="article-tags" class="mt-2"></div>
        </div>

        <!-- Author card -->
        <div class="mt-5 p-4 rounded-3" style="background:var(--bg-soft);border:1px solid var(--border)">
          <div class="d-flex align-items-center gap-3">
            <div id="article-author-avatar-card"></div>
            <div>
              <div class="fw-bold" id="article-author-name-card"></div>
              <div class="text-muted small" id="article-author-bio-card"></div>
            </div>
          </div>
        </div>

      </div>
    </div>

    <!-- Related articles -->
    <div class="row justify-content-center mt-5">
      <div class="col-lg-8">
        <div class="related-title">Artikel Terkait</div>
        <div class="article-grid" id="related-grid"></div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer mt-5">
    <div class="container d-flex align-items-center justify-content-between flex-wrap gap-2">
      <span>&copy; 2025 KampusKita</span>
      <div class="footer-links">
        <a href="#">Tentang</a>
        <a href="#">Kebijakan Privasi</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/app.js"></script>

  <!-- Patch: fill author card after article loads -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Wait for initArticle to run, then patch author card
      setTimeout(() => {
        const authorNameEl = document.getElementById('article-author-name');
        const avatarCardEl = document.getElementById('article-author-avatar-card');
        const nameCardEl   = document.getElementById('article-author-name-card');
        const bioCardEl    = document.getElementById('article-author-bio-card');
        if (!authorNameEl || !avatarCardEl) return;
        const name = authorNameEl.textContent;
        if (!name) return;
        avatarCardEl.innerHTML = avatarHTML(name, 52);
        if (nameCardEl) nameCardEl.textContent = name;

        // Try to get bio from users
        const params = new URLSearchParams(window.location.search);
        const article = getArticleById(params.get('id'));
        if (article && bioCardEl) {
          const users = getUsers();
          const author = users.find(u => u.id === article.authorId);
          bioCardEl.textContent = author?.bio || 'Penulis di KampusKita.';
        }
      }, 50);
    });
  </script>
</body>
</html>
