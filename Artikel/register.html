<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar</title>
  <link rel="icon" href="../Asset/logo/K.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body data-page="register" class="auth-page">

  <div class="auth-card">

    <div class="auth-logo"><a href="index.html" style="text-decoration: none;">Kampus<span>Kita</span></a></div>
    <p class="auth-subtitle">Buat akun dan mulai berbagi cerita</p>

    <form id="register-form" novalidate autocomplete="off">

      <div class="mb-3">
        <label for="fullname" class="form-label">Nama Lengkap</label>
        <input type="text" class="form-control" id="fullname" name="fullname"
               placeholder="Nama kamu" autocomplete="name" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email"
               placeholder="kamu@kampus.ac.id" autocomplete="email" required>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password"
               placeholder="Minimal 6 karakter" autocomplete="new-password" required>
      </div>

      <div class="mb-4">
        <label for="confirm" class="form-label">Konfirmasi Password</label>
        <input type="password" class="form-control" id="confirm" name="confirm"
               placeholder="Ulangi password" autocomplete="new-password" required>
      </div>

      <button type="submit" class="btn-auth">Buat Akun</button>

    </form>

    <div class="auth-switch">
      Sudah punya akun? <a href="login.html">Masuk di sini</a>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
