<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tulis Artikel</title>
  <link rel="icon" href="../Asset/logo/K.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body data-page="write" class="write-page">

  <!-- Navbar -->
  <nav class="site-navbar">
    <div class="container d-flex align-items-center justify-content-between gap-3">
      <a href="index.html" class="navbar-logo">Kampus<span>Kita</span></a>

      <div class="d-flex align-items-center gap-2">
        <span class="text-muted" style="font-size:.8rem" id="draft-status"></span>
        <div id="nav-auth" class="d-flex align-items-center gap-2"></div>
      </div>
    </div>
  </nav>

  <!-- Write -->
  <main>
    <div class="write-container">

      <form id="write-form" novalidate>

        <!-- Title -->
        <div class="mb-0">
          <input type="text" class="form-control write-title" id="article-title" name="article-title"
                 placeholder="Judul artikel..." autocomplete="off" required>
          <div class="invalid-feedback" style="font-family:var(--font-ui);font-size:.8rem"></div>
        </div>

        <!-- Divider hint -->
        <p class="text-muted mt-2 mb-1" style="font-size:.8rem">
          Tip: Pisahkan paragraf dengan baris kosong. Awali baris dengan <code>#</code> untuk sub-judul.
        </p>

        <!-- Content -->
        <div>
          <textarea class="form-control write-body" id="article-content" name="article-content"
                    placeholder="Mulai tulis ceritamu di sini...

Paragraf baru dipisahkan dengan baris kosong.

# Ini Sub-Judul

Lanjutkan tulisanmu..."
                    required></textarea>
          <div class="invalid-feedback" style="font-family:var(--font-ui);font-size:.8rem"></div>
        </div>

        <!-- Toolbar -->
        <div class="write-toolbar">
          <select class="write-select" id="article-category" name="article-category">
            <option value="Teknologi">Teknologi</option>
            <option value="Kampus">Kampus</option>
            <option value="Riset">Riset</option>
            <option value="Opini">Opini</option>
          </select>

          <button type="submit" class="btn-publish">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" class="me-1">
              <path d="M15.964.686a.5.5 0 0 0-.65-.65L.767 5.855H.766l-.452.18a.5.5 0 0 0-.082.887l.41.26.001.002 4.995 3.178 3.178 4.995.002.002.26.41a.5.5 0 0 0 .886-.083l6-15Zm-1.833 1.89L6.637 10.07l-.215-.338a.5.5 0 0 0-.154-.154l-.338-.215 7.494-7.494 1.178-.471-.47 1.178Z"/>
            </svg>
            Terbitkan
          </button>

          <span class="write-hint" id="char-count">0 kata</span>
        </div>

      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/app.js"></script>

  <!-- Live word count & autosave draft -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const contentEl = document.getElementById('article-content');
      const titleEl   = document.getElementById('article-title');
      const countEl   = document.getElementById('char-count');
      const statusEl  = document.getElementById('draft-status');

      // Restore draft
      const draft = JSON.parse(localStorage.getItem('draft') || '{}');
      if (draft.title)   titleEl.value   = draft.title;
      if (draft.content) contentEl.value = draft.content;
      if (draft.category) {
        const sel = document.getElementById('article-category');
        if (sel) sel.value = draft.category;
      }
      updateCount();

      contentEl.addEventListener('input', () => { updateCount(); saveDraft(); });
      titleEl.addEventListener('input', saveDraft);

      function updateCount() {
        const words = contentEl.value.trim().split(/\s+/).filter(Boolean).length;
        const mins  = Math.max(1, Math.round(words / 200));
        countEl.textContent = `${words} kata · ~${mins} menit baca`;
      }

      let draftTimer;
      function saveDraft() {
        clearTimeout(draftTimer);
        draftTimer = setTimeout(() => {
          const sel = document.getElementById('article-category');
          localStorage.setItem('draft', JSON.stringify({
            title:    titleEl.value,
            content:  contentEl.value,
            category: sel ? sel.value : 'Teknologi',
          }));
          statusEl.textContent = 'Draft tersimpan';
          setTimeout(() => { statusEl.textContent = ''; }, 2000);
        }, 800);
      }

      // Clear draft on publish
      document.getElementById('write-form').addEventListener('submit', () => {
        localStorage.removeItem('draft');
      });
    });
  </script>
</body>
</html>
