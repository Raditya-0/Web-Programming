<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body data-page="profile">

  <!-- Navbar -->
  <nav class="site-navbar">
    <div class="container d-flex align-items-center justify-content-between gap-3">
      <a href="index.html" class="navbar-logo">Kampus<span>Kita</span></a>
      <div class="d-flex align-items-center gap-2" id="nav-auth"></div>
    </div>
  </nav>

  <!-- Profile -->
  <main class="container">

    <!-- Header -->
    <div class="profile-header">
      <div class="row align-items-center gy-3">
        <div class="col-auto">
          <div class="profile-avatar-wrap" id="profile-avatar"></div>
        </div>
        <div class="col">
          <h1 class="profile-name" id="profile-name"></h1>
          <p class="profile-bio mb-2" id="profile-bio"></p>
          <div class="text-muted" style="font-size:.8rem" id="profile-join"></div>
        </div>
        <div class="col-auto">
          <button class="btn-edit-profile" data-bs-toggle="modal" data-bs-target="#editProfileModal">
            Edit Profil
          </button>
        </div>
      </div>

      <!-- Stats row -->
      <div class="d-flex mt-4 pt-3" style="border-top:1px solid var(--border)">
        <div class="stat-item ps-0">
          <span class="stat-number" id="profile-article-count">0</span>
          <span class="stat-label">Artikel</span>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <ul class="nav" id="profile-tabs" style="border-bottom:1px solid var(--border);margin-bottom:1.5rem;">
      <li class="nav-item">
        <button class="nav-link active" data-tab="my-articles">Artikel Saya</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-tab="saved">Disimpan</button>
      </li>
    </ul>

    <!-- Tab content -->
    <div style="max-width:640px;">
      <div class="tab-content-panel" id="tab-my-articles">
        <div id="my-articles-list"></div>
      </div>
      <div class="tab-content-panel d-none" id="tab-saved">
        <div id="saved-articles-list"></div>
      </div>
    </div>

  </main>

  <!-- Edit Profile Modal -->
  <div class="modal fade" id="editProfileModal" tabindex="-1" aria-labelledby="editProfileModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content border-0 shadow">
        <div class="modal-header border-0 pb-0">
          <h5 class="modal-title fw-bold" id="editProfileModalLabel">Edit Profil</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body pt-3">
          <form id="edit-profile-form" novalidate>
            <div class="mb-3">
              <label for="edit-fullname" class="form-label" style="font-size:.85rem;font-weight:600">Nama Lengkap</label>
              <input type="text" class="form-control" id="edit-fullname" name="fullname" required
                     style="border-radius:8px;font-size:.9rem">
            </div>
            <div class="mb-4">
              <label for="edit-bio" class="form-label" style="font-size:.85rem;font-weight:600">Bio</label>
              <textarea class="form-control" id="edit-bio" name="bio" rows="3"
                        placeholder="Ceritakan sedikit tentang kamu…"
                        style="border-radius:8px;font-size:.9rem;resize:none"></textarea>
            </div>
            <div class="d-flex gap-2 justify-content-end">
              <button type="button" class="btn btn-outline-secondary btn-sm px-3" data-bs-dismiss="modal"
                      style="border-radius:8px;">Batal</button>
              <button type="submit" class="btn btn-sm px-4 text-white"
                      style="background:var(--accent);border:none;border-radius:8px;">Simpan</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer mt-5">
    <div class="container d-flex align-items-center justify-content-between flex-wrap gap-2">
      <span>&copy; 2025 KampusKita</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
