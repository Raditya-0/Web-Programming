<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KampusKita</title>
  <link rel="icon" href="../Asset/logo/K.png" type="image/png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body data-page="index">

  <!-- Navbar -->
  <nav class="site-navbar">
    <div class="container d-flex align-items-center justify-content-between gap-3">
      <a href="../Menu/index.html" class="navbar-logo">Kampus<span>Kita</span></a>

      <div class="d-flex align-items-center gap-1 d-none d-md-flex">
        <a href="index.html" class="nav-link-item active">Beranda</a>
        <a href="#topics" class="nav-link-item">Topik</a>
      </div>

      <div class="d-flex align-items-center gap-2" id="nav-auth">
        <!-- rendered by app.js -->
      </div>
    </div>
  </nav>

  <!-- Main -->
  <main class="container py-0">
    <div class="row">

      <!-- Left: feed -->
      <div class="col-lg-8">

        <!-- Featured -->
        <div id="featured-article"></div>

        <!-- Category filter -->
        <div class="filter-bar mt-3" id="category-filter">
          <button class="filter-btn active" data-filter="Semua">Semua</button>
          <button class="filter-btn" data-filter="Teknologi">Teknologi</button>
          <button class="filter-btn" data-filter="Kampus">Kampus</button>
          <button class="filter-btn" data-filter="Riset">Riset</button>
          <button class="filter-btn" data-filter="Opini">Opini</button>
        </div>

        <!-- Article grid -->
        <div class="article-grid" id="article-grid"></div>
      </div>

      <!-- Right: sidebar -->
      <div class="col-lg-4 sidebar-col ps-lg-4">
        <div style="position:sticky;top:76px;padding:2rem 0;">

          <div class="sidebar-section" id="topics">
            <div class="sidebar-title">Topik Populer</div>
            <div id="sidebar-topics"></div>
          </div>

          <div class="sidebar-section">
            <div class="sidebar-title">Penulis Direkomendasikan</div>
            <div id="sidebar-authors"></div>
          </div>

          <div class="sidebar-section">
            <div class="sidebar-title">Tentang KampusKita</div>
            <p style="font-size:.83rem;color:var(--text-muted);line-height:1.6">
              Platform berita dan artikel mahasiswa. Tulis, bagikan, dan temukan tulisan terbaik dari komunitas kampus.
            </p>
            <a href="register.html" class="btn btn-sm btn-outline-secondary w-100" style="font-size:.82rem;border-radius:8px;">
              Mulai Menulis
            </a>
          </div>

        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer mt-5">
    <div class="container d-flex align-items-center justify-content-between flex-wrap gap-2">
      <span>&copy; 2025 KampusKita</span>
      <div class="footer-links">
        <a href="#">Tentang</a>
        <a href="#">Kebijakan Privasi</a>
        <a href="#">Syarat &amp; Ketentuan</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="./js/data.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
