<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cari Kode Pos</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
    <div class="form-wrapper">
      <div class="form-header" style="margin-bottom: 2rem;">
        <h1>Find postal code</h1>
        <p>Cari kode pos di wilayah Indonesia dengan menggunakan daftar wilayah di bawah ini.</p>
      </div>

      <div class="form-group full-width">
        <label for="provinsi">Provinsi</label>
        <select id="provinsi" name="provinsi">
          <option value="">-- Pilih Provinsi --</option>
        </select>
      </div>

      <div class="form-group full-width">
        <label for="kabupaten">Kota / Kabupaten</label>
        <select id="kabupaten" name="kabupaten" disabled>
          <option value="">-- Pilih Kota / Kabupaten --</option>
        </select>
      </div>

      <div class="form-group full-width">
        <label for="kecamatan">Kecamatan</label>
        <select id="kecamatan" name="kecamatan" disabled>
          <option value="">-- Pilih Kecamatan --</option>
        </select>
      </div>

      <div class="form-group full-width">
        <label for="kelurahan">Kelurahan / Desa</label>
        <select id="kelurahan" name="kelurahan" disabled>
          <option value="">-- Pilih Kelurahan / Desa --</option>
        </select>
      </div>

      <button id="btnSearch" class="btn-primary" style="margin-top: 1rem;" disabled>Cari Kode Pos</button>
      
      <div class="loader" id="searchLoader" style="margin-top: 2rem;"></div>

      <div id="resultsContainer" class="search-results">
        <h2 style="font-size: 1.2rem; margin-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 0.5rem;">Hasil Pencarian</h2>
        <div id="resultsContent">
        </div>
      </div>
      
      <a href="index.html" class="link-hint" style="display: block; text-align: center; margin-top: 2rem;"><< Kembali ke Halaman Registrasi</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
