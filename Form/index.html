<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Your Account</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/css/intlTelInput.css"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/intlTelInput.min.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
</head>
<body>
  <div class="container">
    <div class="top-navbar">
      <a href="../Menu/index.html" class="back-link">
        ← Kembali ke Beranda
      </a>
    </div>
    <div class="form-wrapper">
      <div class="form-header">
        <h1>Create your account</h1>
      </div>

      <form id="registrationForm">
        <div class="grid-2">
          <!-- Name Input Autocomplete -->
          <div class="form-group full-width">
            <label for="fullName">Account name</label>
            <input type="text" id="fullName" name="fullName" list="nameSuggestions" placeholder="Required" required autocomplete="off">
            <datalist id="nameSuggestions">
            </datalist>
          </div>

          <div class="form-group">
            <label for="email">Email address</label>
            <input type="email" id="email" name="email" placeholder="Required" required>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Required" required>
          </div>
        </div>

        <div class="grid-2">
          <!-- Address Fields -->
          <div class="form-group full-width">
            <label for="address">Address</label>

            <div class="input-map-wrapper">
              <input type="text" id="address" name="address" placeholder="Jalan Raya, No Rumah" required>

              <button type="button" id="btnMap" class="btn-map">
                <image src="../Asset/logo/map.png" alt="Map Icon" style="width:20px; height:20px;">
              </button>
            </div>

            <div id="map" style="height:300px; margin-top:10px; display:none;"></div>
          </div>

          <div class="form-group">
            <label for="postalCode">Zip or postal code</label>
            <input type="text" id="postalCode" name="postalCode" placeholder="e.g. 60111" required>
            <a href="kodepos.html" class="link-hint">Lupa Kode Pos Anda?</a>
          </div>

          <div class="form-group">
            <label for="phone">Phone number</label>
            <input type="tel" id="phone" name="phone" required>
          </div>
        </div>

        <button type="submit" class="btn-primary" style="margin-top: 1rem;">Create account</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
  <script>
    const phoneInputField = document.querySelector("#phone");
    const phoneInput = window.intlTelInput(phoneInputField, {
      initialCountry: "id",
      preferredCountries: ["id", "us", "gb", "mx", "ca"],
      utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.19/js/utils.js",
    });
  </script>
</body>
</html>
